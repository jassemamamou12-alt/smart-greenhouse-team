# ---------------------------------------------------------------
# Smart Greenhouse — environnement local de développement
# Usage : docker compose up --build
# API   : http://localhost:8000/api/health
# BDD   : postgresql://app:app@localhost:5432/greenhouse
# ---------------------------------------------------------------
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Local : on installe les dépendances de dev, sinon config/bundles.php
        # (MakerBundle, 'dev' => true) provoque un ClassNotFoundError en APP_ENV=dev.
        # Render/CI gardent le défaut "--no-dev" du Dockerfile.
        COMPOSER_INSTALL_FLAGS: ""
    container_name: greenhouse-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: change-me-local-dev-secret
      PORT: "8000"
      DATABASE_URL: postgresql://app:app@db:5432/greenhouse?serverVersion=16&charset=utf8
      # Origines autorisees a appeler l'API depuis un autre domaine.
      # '*' = tout le monde (acceptable en local / tant que l'API est publique).
      CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: greenhouse-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: greenhouse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d greenhouse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
