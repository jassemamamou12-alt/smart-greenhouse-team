# ---------------------------------------------------------------
# Smart Greenhouse — Render Blueprint
#
# Ce fichier décrit les services Render hébergés par le projet.
# Il est optionnel : les services créés à la main dans le Dashboard
# fonctionnent sans lui. Il sert de **documentation as code** et
# permet de recréer l'environnement en un clic.
#
# ⚠️ Le service API (`smart-greenhouse-api`) n'est PAS décrit ici :
#    il a été créé manuellement dans le Dashboard Render. L'ajouter
#    risquerait de le recréer en double. Il est documenté plus bas
#    dans ce fichier, dans le commentaire "API".
#
# Déployer :  Dashboard Render → New → Blueprint → choisir ce repo
# ---------------------------------------------------------------

services:
  # =============================================================
  # FRONTEND — application Flutter (web)
  # =============================================================
  - type: web
    name: smart-greenhouse-frontend
    runtime: static

    # Branche déployée automatiquement.
    # `checksPass` = Render n'épublie QUE si la CI GitHub est verte :
    # un code cassé n'atteint jamais le navigateur.
    branch: development
    autoDeploy: checksPass

    # Build : installe Flutter (pas préinstallé sur Render), analyse,
    # teste, puis compile en web. Voir scripts/build-frontend.sh
    buildCommand: bash scripts/build-frontend.sh

    # Dossier publié par le CDN (= sortie de flutter build web)
    staticPublishPath: frontend/build/web

    # Monorepo : ne rebuild QUE si le frontend ou son script change.
    # Évite de reconstruire Flutter quand seul backend/ bouge.
    buildFilter:
      paths:
        - 'frontend/**'
        - 'scripts/build-frontend.sh'
        - 'render.yaml'

    envVars:
      - key: API_URL
        value: https://smart-greenhouse-api-em2b.onrender.com

    # Flutter web utilise un routeur côté client : toute route inconnue
    # doit retomber sur index.html (sinon 404 au refresh sur /dashboard).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # index.html doit toujours être relu : c'est lui qui référence
      # le bon numéro de version de main.dart.js
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

# =============================================================
# API — service existant, créé MANUELLEMENT dans Render
# =============================================================
# Nom        : smart-greenhouse-api
# Type       : Web Service (Docker)
# Branche    : main
# Région     : Frankfurt (eu-central-1)
# Plan       : Free
# URL        : https://smart-greenhouse-api-em2b.onrender.com
# Dockerfile : ./Dockerfile  (à la racine du repo)
# Port       : $PORT (10000 par défaut sur Render)
#
# Variables d'environnement (Dashboard → Environment) :
#   APP_ENV             = prod
#   APP_DEBUG           = 0
#   APP_SECRET          = <généré, jamais commité>
#   DATABASE_URL        = <Internal URL de smart-greenhouse-db>
#   CORS_ALLOWED_ORIGINS = https://smart-greenhouse-frontend.onrender.com
#
# ⚠️ CORS_ALLOWED_ORIGINS doit être mis à jour avec l'URL RÉELLE du
#    frontend une fois le Static Site créé (Render génère un nom
#    aléatoire du type smart-greenhouse-frontend-xxxx.onrender.com).
# =============================================================

# =============================================================
# BASE DE DONNÉES — créée MANUELLEMENT dans Render
# =============================================================
# Nom    : smart-greenhouse-db
# Type   : PostgreSQL 18
# Région : Frankfurt
# Plan   : Free
# ⏰ EXPIRE LE 21 DÉCEMBRE 2026 → dump ou upgrade avant cette date.
# =============================================================
